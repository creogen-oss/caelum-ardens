unit.bigtooth.name=大牙虫
unit.bigtooth.description=啃食金属的甲虫，有大颚和翅膀。
unit.bombardier-dragonfly.name=轰炸蜻蜓
unit.bombardier-dragonfly.description=投掷爆炸性粘液块以狩猎和保护巢穴及幼虫的甲虫。
unit.dragonfly-larva.name=蜻蜓幼虫
unit.dragonfly-larva.description=像恐怖片里的外星人，一点也不像它的母亲。
unit.lavawalker.name=熔岩行者
unit.lavawalker.description=五条腿在熔岩上行走的蜘蛛。熔岩里到底有什么东西，能把这么俊俏的腿咬掉？
unit.spitter-junior.name=小型喷射甲虫
unit.spitter-junior.description=狩猎时吐出腐蚀性粘液。我觉得这是幼虫。
unit.spitter-senior.name=大型喷射甲虫
unit.spitter-senior.description=老爸来吃金属大餐了。
unit.sparkfish.name=火花鱼
unit.sparkfish.description=狩猎时喷出熔岩的熔岩鱼。
unit.hammerhopper.name=锤击蝗虫
unit.hammerhopper.description=头部甲壳增厚的甲虫，用作撞锤粉碎矿物并威慑捕食者。
unit.healer-firefly.name=治疗萤火虫
unit.healer-firefly.description=发出热脉冲以加热巢穴并向其他个体发送信号的甲虫。它的身体覆盖着耐热外壳。
unit.harpoon-scorpion.name=鱼叉蝎
unit.harpoon-scorpion.description=从尾部向猎物投掷鱼叉的巨型蝎子。
unit.ancient-lobster-dragonfly.name=古代龙虾蜻蜓
unit.ancient-lobster-dragonfly.description=大型蜻蜓，带有螯钳，向猎物投掷爆炸性粘液团。
unit.big-spitting-crab-spider.name=大型喷射蟹蛛
unit.big-spitting-crab-spider.description=在熔岩上移动的蜘蛛，狩猎时向猎物喷出酸性熔岩。所以就是它咬断更小蜘蛛的腿。
unit.shevtsov.name=舍夫佐夫
unit.shevtsov.description=最小的生物，比夸克还小。

