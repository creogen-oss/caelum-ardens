unit.station-module.name=Строительный модуль станции
unit.station-module.description=Модуль для строительства добывающих баз и защиты.
unit.researcher.name=Исследователь
unit.researcher.description=Дрон для строительства, добывает топливо из атмосферы через обшивку.
unit.earthmover.name=1000-thr Earthmover
unit.earthmover.description=Титанический робот для разработки непригодных для жизни планет.

unit.bigtooth.name=Большезубка
unit.bigtooth.description=Жук, грызущий металл, с большими жевалами и крыльями.
unit.bombardier-dragonfly.name=Стрекоза-бомбордир
unit.bombardier-dragonfly.description=Жук, скидывающий комки взрывоопасной слизи, для охоты и защиты гнёзд и личинок.
unit.dragonfly-larva.name=Личинка стрекозы
unit.dragonfly-larva.description=Что-то похожее на пришельца из ужастиков, а не на свою мать.
unit.lavawalker.name=Лавомерка
unit.lavawalker.description=Паук с 5-ю лапами, ходящий по лаве. Что такое обитает в лаве, откусывающее лапы таким красавцам?
unit.spitter-junior.name=Жук плеватель младший
unit.spitter-junior.description=Плюёт едкой слизью во время охоты. И мне кажется, что это личинка.
unit.spitter-senior.name=Жук плеватель старший
unit.spitter-senior.description=Вот и батя пришёл за обедом из металла.
unit.sparkfish.name=Спаркфиш
unit.sparkfish.description=Лавовая рыба, плюющаяся лавой во время охоты.
unit.hammerhopper.name=Кузнечик молотобоец
unit.hammerhopper.description=Жук с утолщённым панцирем головы, используемый как таран для дробления минералов и отпугивания хищников.
unit.healer-firefly.name=Светляк лекарь
unit.healer-firefly.description=Жук, излучающий тепловые импульсы для обогрева гнезда и подачи сигнала другим особям. Его тело покрыто термостойкой оболочкой.
unit.harpoon-scorpion.name=Гарпунный скорпион
unit.harpoon-scorpion.description=Гигантский скорпион, кидающий гарпун из хвоста в жертву.
unit.ancient-lobster-dragonfly.name=Древняя лобстерная стрекоза
unit.ancient-lobster-dragonfly.description=Стрекоза больших размеров с клешнями, бросающая в добычу взрывоопасные комки слизи.
unit.big-spitting-crab-spider.name=Большой плюющийся крабовый паук
unit.big-spitting-crab-spider.description=Паук, передвигающийся по лаве, плюющийся кислотной лавой в добычу во время охоты. Так вот кто откусывает лапы более маленьким паукам.
unit.shevtsov.name=Шевцов
unit.shevtsov.description=Самое маленькое существо, которое меньше кварка.

