unit.station-module.name=Будаўнічы модуль станцыі
unit.station-module.description=Модуль для будаўніцтва здабыўных баз і абароны.
unit.researcher.name=Даследчык
unit.researcher.description=Дрон для будаўніцтва, здабывае паліва з атмасферы праз абшыўку.
unit.earthmover.name=1000-thr Зямлярой
unit.earthmover.description=Тытанічны робат для распрацоўкі непрыдатных для жыцця планет.

unit.bigtooth.name=Зубасцік
unit.bigtooth.description=Жук, які грызе метал, з вялікімі жваламі і крыламі.
unit.bombardier-dragonfly.name=Страказа-бамбардзір
unit.bombardier-dragonfly.description=Жук, які скідвае камякі выбуховай слізі для палявання і абароны гнёздаў і лічынак.
unit.dragonfly-larva.name=Лічынка страказы
unit.dragonfly-larva.description=Падобнае на прышэльца з фільма жахаў, а не на сваю маці.
unit.lavawalker.name=Лаваход
unit.lavawalker.description=Павук з 5-ю лапамі, які ходзіць па лаве. Што ж такое жыве ў лаве, што адкусвае лапы такому красуню?
unit.spitter-junior.name=Жук-плювальнік малодшы
unit.spitter-junior.description=Плюе едкай сліззю падчас палявання. І мне здаецца, што гэта лічынка.
unit.spitter-senior.name=Жук-плювальнік старэйшы
unit.spitter-senior.description=Вось і бацька прыйшоў на абед з металу.
unit.sparkfish.name=Іскрарыба
unit.sparkfish.description=Лававая рыба, якая плюецца лавай падчас палявання.
unit.hammerhopper.name=Конік-молатабой
unit.hammerhopper.description=Жук з патоўшчаным панцырам галавы, выкарыстоўваецца як таран для дроблення мінералаў і адпуджвання драпежнікаў.
unit.healer-firefly.name=Святляк-урач
unit.healer-firefly.description=Жук, які выпраменьвае цеплавыя імпульсы для абагрэву гнязда і падачы сігналу іншым асобінам. Яго цела пакрыта цеплаўстойлівай абалонкай.
unit.harpoon-scorpion.name=Скарпіён-гарпуннік
unit.harpoon-scorpion.description=Гіганцкі скарпіён, які кідае гарпун з хваста ў ахвяру.
unit.ancient-lobster-dragonfly.name=Старажытная амаравая страказа
unit.ancient-lobster-dragonfly.description=Вялікая страказа з кляшнямі, якая кідае ў здабычу выбуховыя камякі слізі.
unit.big-spitting-crab-spider.name=Вялікі плюючы крабавы павук
unit.big-spitting-crab-spider.description=Павук, які перасоўваецца па лаве, плюючы кіслай лавай у здабычу падчас палявання. Вось хто адкусвае лапы меншым павукам.
unit.shevtsov.name=Шаўцоў
unit.shevtsov.description=Самая маленькая істота, меншая за кварк.

