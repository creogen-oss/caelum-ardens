unit.station-module.description=Módulo pa' construir bases de extracción y defensa.
unit.researcher.name=Investigador
unit.researcher.description=Dron de construcción, extrae combustible de la atmósfera a través del revestimiento.
unit.earthmover.name=1000-thr Earthmover
unit.earthmover.description=Robot titánico pa' desarrollar planetas inhabitables.

unit.bigtooth.name=Dientudo
unit.bigtooth.description=Bicho que roe metal, con unas re-mandíbulas grandes y alas.
unit.bombardier-dragonfly.name=Libélula bombardeadora
unit.bombardier-dragonfly.description=Bicho que tira bolas de baba explosiva pa' cazar y proteger los nidos y las larvas.
unit.dragonfly-larva.name=Larva de libélula
unit.dragonfly-larva.description=Parece un extraterrestre de peli de terror, no a su vieja.
unit.lavawalker.name=Andador de lava
unit.lavawalker.description=Araña con 5 patas que anda sobre lava. ¿Qué mierda vive en la lava que le arranca las patas a semejante fachero?
unit.spitter-junior.name=Cucarrón escupidor chico
unit.spitter-junior.description=Escupe baba corrosiva mientras caza. Y pa' mí que esto es una larva.
unit.spitter-senior.name=Cucarrón escupidor grande
unit.spitter-senior.description=Ahí llegó el viejo a comer su pasto de metal.
unit.sparkfish.name=Sparkfish
unit.sparkfish.description=Pez de lava que escupe lava mientras caza.
unit.hammerhopper.name=Tucura martillo
unit.hammerhopper.description=Bicho con el caparazón de la cabeza re-grueso, usado como ariete pa' romper minerales y ahuyentar depredadores.
unit.healer-firefly.name=Luciérnaga curandera
unit.healer-firefly.description=Bicho que tira pulsos de calor pa' calentar el nido y avisar a otros bichos. Su cuerpo está forrado con una cáscara que aguanta el calor.
unit.harpoon-scorpion.name=Alacrán arponero
unit.harpoon-scorpion.description=Escorpión gigante que tira un arpón desde la cola contra su presa.
unit.ancient-lobster-dragonfly.name=Libélula langosta antigua
unit.ancient-lobster-dragonfly.description=Libélula re-grande con pinzas que tira bolitas de baba explosiva a su presa.
unit.big-spitting-crab-spider.name=Araña cangrejo escupidora grande
unit.big-spitting-crab-spider.description=Araña que se mueve por la lava y escupe lava ácida a su presa mientras caza. ¡Así que ese es el que le arranca las patas a las arañas más chicas!
unit.shevtsov.name=Shevtsov
unit.shevtsov.description=La criatura más chica, más chica que un quark.

