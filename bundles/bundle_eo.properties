unit.station-module.name=Konstrua modulo de stacio
unit.station-module.description=Modulo por konstrui minajn bazojn kaj defendon.
unit.researcher.name=Esploristo
unit.researcher.description=Konstrua flugilo, ekstraktas brulaĵon el atmosfero tra la kovrilo.
unit.earthmover.name=1000-thr Teromovilo
unit.earthmover.description=Titana roboto por disvolvi planedojn ne loĝeblajn.

unit.bigtooth.name=Grandadenta
unit.bigtooth.description=Skarabo, kiu mordas metalon, kun grandaj makzeloj kaj flugiloj.
unit.bombardier-dragonfly.name=Bombardocipredo
unit.bombardier-dragonfly.description=Skarabo, kiu faligas bulojn de eksplodema mukozoj por ĉasado kaj protektado de nestoj kaj larvoj.
unit.dragonfly-larva.name=Larvo de cipredo
unit.dragonfly-larva.description=Aspektas kiel eksterterano el horora filmo, ne kiel sia patrino.
unit.lavawalker.name=Lavopromenanto
unit.lavawalker.description=Araneo kun 5 kruroj, marŝanta sur lafo. Kio loĝas en lafo, kiu mordas la krurojn de tia belulo?
unit.spitter-junior.name=Eta kraĉoskarabo
unit.spitter-junior.description=Kraĉas korodan mukozon dum ĉasado. Kaj ŝajnas al mi, ke tio estas larvo.
unit.spitter-senior.name=Granda kraĉoskarabo
unit.spitter-senior.description=Jen paĉjo venis por metala tagmanĝo.
unit.sparkfish.name=Sparkfiŝo
unit.sparkfish.description=Lavfiŝo, kiu kraĉas lavon dum ĉasado.
unit.hammerhopper.name=Martelolokusto
unit.hammerhopper.description=Skarabo kun dika kapokiraso, uzata kiel arieto por disbatigi mineralojn kaj fortimigi predantojn.
unit.healer-firefly.name=Kuracistolampiro
unit.healer-firefly.description=Skarabo, kiu elsendas termikajn pulsojn por varmigi la neston kaj signali al aliaj individuoj. Lia korpo estas kovrita per termorezista ŝelo.
unit.harpoon-scorpion.name=Harpunskorpio
unit.harpoon-scorpion.description=Giganta skorpio, kiu ĵetas harpunon el la vosto al predo.
unit.ancient-lobster-dragonfly.name=Antikva cipredo-lobsto
unit.ancient-lobster-dragonfly.description=Granda cipredo kun pinĉiloj, kiu ĵetas eksplodemajn mukobulojn al predo.
unit.big-spitting-crab-spider.name=Granda kraĉanta krabaraneo
unit.big-spitting-crab-spider.description=Araneo, kiu moviĝas sur lafo, kraĉante acidan lavon al predo dum ĉasado. Do jen kiu mordas la krurojn de pli malgrandaj araneoj.
unit.shevtsov.name=Ŝevcov
unit.shevtsov.description=La plej malgranda estaĵo, pli malgranda ol kvarko.

